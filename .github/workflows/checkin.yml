name: mt论坛自动签到

on:
  schedule:
    # 固定时间点签到(UTC 时间), 对应北京时间:
    #   16:10 -> 00:10 | 17:10 -> 01:10 | 18:10 -> 02:10
    #   19:10 -> 03:10 | 20:10 -> 04:10 | 21:10 -> 05:10
    # 由下方"校验中国时间窗口"步骤保证只有落在 00:01~06:00 内的运行才真正签到;
    # 脚本自身记录当天已签, 因此多次运行也只会签到一次。
    - cron: '10 16-21 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 校验中国时间窗口
      id: window
      if: github.event_name == 'schedule'
      run: |
        h=$((10#$(TZ=Asia/Shanghai date +%H)))
        m=$((10#$(TZ=Asia/Shanghai date +%M)))
        mins=$((h * 60 + m))
        now=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
        if [ "$mins" -lt 1 ] || [ "$mins" -gt 360 ]; then
          echo "当前中国时间 $now 不在 00:01~06:00 窗口, 跳过本次运行"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "当前中国时间 $now 在 00:01~06:00 窗口内, 立即签到"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 运行签到
      if: github.event_name != 'schedule' || steps.window.outputs.skip == 'false'
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
      run: python main.py
