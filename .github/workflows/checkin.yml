name: mt论坛自动签到

on:
  schedule:
    # GitHub 定时任务经常延迟 1~6 小时甚至更久, 因此不再限定"凌晨窗口":
    # 当天任意时刻执行都可以, 脚本自身记录当天已签, 多次运行也只会签到一次。
    # 之前把窗口限制在 00:01~06:00, 延迟到 07~09 点的运行会被整段丢弃, 造成漏签。
    - cron: '10 16-21 * * *'
  workflow_dispatch:

# 避免多个定时运行同时签到/同时提交数据库造成互相覆盖
concurrency:
  group: mt-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行签到
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
      run: python main.py
